name: Code Quality

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: requirements*.txt

    - name: Install dependencies
      run: |
        uv venv --python 3.11
        uv pip sync --require-hashes requirements-dev.txt

    - name: Check dependency locks
      run: |
        uv pip compile pyproject.toml --universal --python .venv --python-version 3.10 --generate-hashes --no-header --output-file requirements.txt > /dev/null
        uv pip compile pyproject.toml --extra dev --universal --python .venv --python-version 3.10 --generate-hashes --no-header --constraint requirements.txt --output-file requirements-dev.txt > /dev/null
        git diff --exit-code -- requirements.txt requirements-dev.txt

    - name: Run linting with Ruff
      run: |
        uv run ruff check . --output-format=github

    - name: Check code formatting with Ruff
      run: |
        uv run ruff format --check --diff .

    - name: Type checking with Pyright
      run: |
        uv run pyright || echo "⚠️ Type checking failed (non-blocking)"
      continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: requirements*.txt

    - name: Install dependencies
      run: |
        uv venv --python 3.11
        uv pip sync --require-hashes requirements-dev.txt

    - name: Test with pytest and generate coverage
      run: |
        uv run pytest --cov=api --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: htmlcov/

name: "Export Azure Retail API Prices"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: export-prices
  cancel-in-progress: false

jobs:
  export-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: requirements*.txt

    - name: Install dependencies
      run: |
        uv venv --python 3.11
        uv pip sync --require-hashes requirements.txt

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Export Azure prices to CSV
      run: |
        uv run python -c "
        import api.azureapi as azureapi
        import os

        export_df = azureapi.get_prices('USD')
        required = {'currencyCode', 'type', 'retailPrice', 'unitPrice', 'meterId', 'skuId'}
        if export_df.empty or not required.issubset(export_df.columns):
            raise ValueError('Refusing to publish empty or malformed price data')
        if not export_df['currencyCode'].eq('USD').all():
            raise ValueError('Unexpected price currency')
        filename = 'azure-retail-prices-usd.csv'
        export_df.to_csv(filename, index=False)
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f'FILENAME={filename}\n')
            f.write(f'EXPORT_COUNT={len(export_df)}\n')
        "

    - name: Export validated FX rates
      run: |
        uv run python export_fxrates.py --output azure-fxrates-usd.csv
        uv run python -c "
        import os
        import pandas as pd
        fx_df = pd.read_csv('azure-fxrates-usd.csv')
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('FX_FILENAME=azure-fxrates-usd.csv\n')
            f.write(f'FX_COUNT={len(fx_df)}\n')
        "

    - name: Upload CSV as artifact
      uses: actions/upload-artifact@v7
      with:
        name: azure-prices-${{ steps.date.outputs.date }}
        path: |
          ${{ env.FILENAME }}
          ${{ env.FX_FILENAME }}
        retention-days: 90

    - name: Publish dated and latest releases safely
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run python publish_releases.py \
          --repo "${{ github.repository }}" \
          --date "${{ steps.date.outputs.date }}" \
          --prices "$FILENAME" \
          --fx-rates "$FX_FILENAME" \
          --price-count "$EXPORT_COUNT" \
          --fx-count "$FX_COUNT"

    - name: Summary
      run: |
        echo "## Azure Prices Export Complete" >> "$GITHUB_STEP_SUMMARY"
        echo "- Price file: $FILENAME ($EXPORT_COUNT records)" >> "$GITHUB_STEP_SUMMARY"
        echo "- FX file: $FX_FILENAME ($FX_COUNT currencies)" >> "$GITHUB_STEP_SUMMARY"
        echo "- [Dated release](https://github.com/${{ github.repository }}/releases/tag/prices-${{ steps.date.outputs.date }})" >> "$GITHUB_STEP_SUMMARY"
        echo "- [Latest release](https://github.com/${{ github.repository }}/releases/tag/latest)" >> "$GITHUB_STEP_SUMMARY"
